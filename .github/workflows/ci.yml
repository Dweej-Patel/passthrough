# Mirrors the checklist in CONTRIBUTING.md: core tests, both Apple apps build,
# Android tests + lint + build.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Superseded PR pushes are cancelled; every push to main/dev gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Pinned so CI doesn't move when the runner image's default Xcode changes.
env:
  XCODE_APP: /Applications/Xcode_26.3.app

jobs:
  core-tests:
    name: PassthroughCore tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: swift test
        working-directory: Packages/PassthroughCore
        run: swift test

  apple-builds:
    name: Mac and iOS apps build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Generate project
        run: |
          brew install xcodegen
          # No Team ID in CI; the builds below are unsigned.
          cp Config/Signing.xcconfig.example Config/Signing.xcconfig
          xcodegen generate
      - name: Build PassthroughMac
        run: >
          xcodebuild -project Passthrough.xcodeproj -scheme PassthroughMac
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build
      - name: Build Passthrough (iOS)
        run: >
          xcodebuild -project Passthrough.xcodeproj -scheme Passthrough
          -configuration Debug -destination 'generic/platform=iOS'
          -derivedDataPath build/dd-ios CODE_SIGNING_ALLOWED=NO build

  android:
    name: Android tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
