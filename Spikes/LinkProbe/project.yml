# Throwaway spike: can an iPad and an iPhone, both running packet-tunnel
# extensions, reach each other over the iPhone's Personal Hotspot? See README.md.
name: LinkProbe
options:
  bundleIdPrefix: $(PASSTHROUGH_ID)
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
configFiles:
  Debug: ../../Config/Identity.xcconfig
  Release: ../../Config/Identity.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LinkProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - target: LinkProbeTunnel
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Link Probe
        UILaunchScreen: {}
        ProbeAppGroup: group.$(PASSTHROUGH_ID).linkprobe
        NSLocalNetworkUsageDescription: Link Probe tests whether this iPad and iPhone can reach each other on the iPhone's Personal Hotspot.
        NSBonjourServices: [_ptprobe._tcp, _ptprobe._udp]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/LinkProbe.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID).linkprobe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).linkprobe
        PRODUCT_NAME: LinkProbe

  LinkProbeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Link Probe Tunnel
        ProbeAppGroup: group.$(PASSTHROUGH_ID).linkprobe
        NSLocalNetworkUsageDescription: Link Probe tests whether this iPad and iPhone can reach each other on the iPhone's Personal Hotspot.
        NSBonjourServices: [_ptprobe._tcp, _ptprobe._udp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProbeTunnelProvider
    entitlements:
      path: Tunnel/LinkProbeTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID).linkprobe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).linkprobe.tunnel
        PRODUCT_NAME: LinkProbeTunnel
