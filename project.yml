name: Passthrough
options:
  bundleIdPrefix: $(PASSTHROUGH_ID)
  # iroh-ffi's xcframework sets the floors (iOS 17.5 / macOS 14.5).
  deploymentTarget:
    iOS: "17.5"
    macOS: "14.5"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  # The app's Swift package versions (SwiftTerm, iroh-ffi and what they
  # depend on) are pinned in Config/Package.resolved; put it where Xcode reads it.
  postGenCommand: mkdir -p Passthrough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Config/Package.resolved Passthrough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-expression-type-checking=400"
packages:
  PassthroughCore:
    path: Packages/PassthroughCore
  # Terminal emulator view (MIT): the Mac's shell history window and the iPhone's terminal.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0

targets:
  # ───────────────────────── iOS ─────────────────────────
  Passthrough:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
      - package: PassthroughCore
        product: PassthroughUI
      # Remote shell over iroh. App only: never link it into the tunnel extension.
      - package: PassthroughCore
        product: IrohTransport
      - package: PassthroughCore
        product: ScreenClient
      - package: SwiftTerm
        product: SwiftTerm
      - target: PassthroughTunnel
    info:
      path: iOS/App/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        CFBundleDisplayName: Passthrough
        UILaunchScreen: {}
        # Landscape is for the Mac's screen only: AppOrientation keeps the rest portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Passthrough finds your linked Mac on this iPhone's Personal Hotspot, or over peer-to-peer Wi-Fi, when the wireless link is on, and reaches your Mac's shell on the same network.
        NSFaceIDUsageDescription: Passthrough uses Face ID to keep your Mac's shell and settings private.
        NSBonjourServices: [_passthrough._tcp, _passthrough-sh._tcp]
    entitlements:
      path: iOS/App/Passthrough.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).ios
        PRODUCT_NAME: Passthrough
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  PassthroughTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Tunnel
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
    info:
      path: iOS/Tunnel/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        CFBundleDisplayName: Passthrough Tunnel
        NSLocalNetworkUsageDescription: Passthrough finds your linked Mac on this iPhone's Personal Hotspot, or over peer-to-peer Wi-Fi, when the wireless link is on.
        NSBonjourServices: [_passthrough._tcp, _passthrough-sh._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: iOS/Tunnel/PassthroughTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).ios.tunnel
        PRODUCT_NAME: PassthroughTunnel

  # ───────────────────────── macOS ─────────────────────────
  PassthroughMac:
    type: application
    platform: macOS
    sources:
      - path: macOS/App
        excludes: ["Info.plist", "*.entitlements", "*.plist"]
      - path: macOS/Shared
      # VPN-layer engines, spawned by the root helper. Signed on copy so the
      # helper can verify they carry our Team ID before executing them as root.
      - path: Vendor/VPNEngines/bin/wireguard-go
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: Vendor/VPNEngines/bin/openvpn
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
      - package: PassthroughCore
        product: PassthroughUI
      - package: PassthroughCore
        product: PhoneTransport
      - package: PassthroughCore
        product: VPNConfig
      - package: PassthroughCore
        product: ShellHost
      - package: PassthroughCore
        product: ScreenHost
      - package: PassthroughCore
        product: IrohTransport
      - package: SwiftTerm
        product: SwiftTerm
      - target: PassthroughHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
    postCompileScripts:
      - name: Install launchd plist
        inputFiles: [$(SRCROOT)/macOS/App/LaunchDaemon.plist]
        outputFiles: [$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(PASSTHROUGH_ID).helper.plist]
        script: |
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          sed "s/\$(PASSTHROUGH_ID)/$PASSTHROUGH_ID/g" "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
    info:
      path: macOS/App/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        CFBundleDisplayName: Passthrough
        LSUIElement: true
        LSMinimumSystemVersion: "14.5"
        NSHumanReadableCopyright: ""
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Passthrough listens for your linked phone on the local network, such as the phone's Personal Hotspot, when it connects wirelessly.
        NSBonjourServices: [_passthrough._tcp, _passthrough-sh._tcp]
    entitlements:
      path: macOS/App/PassthroughMac.entitlements
      properties:
        # Needed for the data-protection keychain (kSecUseDataProtectionKeychain).
        keychain-access-groups: [$(AppIdentifierPrefix)$(PASSTHROUGH_ID).mac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).mac
        PRODUCT_NAME: Passthrough
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        # iroh-ffi ships a macOS arm64 slice only (like the helper's engines).
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64

  PassthroughHelper:
    type: tool
    platform: macOS
    sources:
      - path: macOS/Helper
      - path: macOS/Shared
    dependencies:
      # Parsing and pinning only (Foundation + CryptoKit); keeps the root helper's surface small.
      - package: PassthroughCore
        product: VPNConfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).helper
        PRODUCT_NAME: PassthroughHelper
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/HevSocks5Tunnel/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/HevSocks5Tunnel/lib
        OTHER_LDFLAGS: ["-lhev-socks5-tunnel", "-lresolv"]
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: macOS/Helper/Info.plist
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64

schemes:
  Passthrough:
    build:
      targets: { Passthrough: all }
    run:
      config: Debug
  PassthroughMac:
    build:
      targets: { PassthroughMac: all }
    run:
      config: Debug
