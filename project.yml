name: Passthrough
options:
  bundleIdPrefix: $(PASSTHROUGH_ID)
  # iroh-ffi's xcframework sets the floors (iOS 17.5 / macOS 14.5).
  deploymentTarget:
    iOS: "17.5"
    macOS: "14.5"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  # The app's Swift package versions (SwiftTerm, iroh-ffi and what they
  # depend on) are pinned in Config/Package.resolved; put it where Xcode reads it.
  postGenCommand: mkdir -p Passthrough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Config/Package.resolved Passthrough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-expression-type-checking=400"
packages:
  PassthroughCore:
    path: Packages/PassthroughCore
  # Terminal emulator view (MIT): the Mac's shell history window and the iPhone's terminal.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0

targets:
  # ───────────────────────── iOS ─────────────────────────
  Passthrough:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
        excludes: ["Info.plist", "*.entitlements"]
      # Shared with the widget extension: links, the Mac snapshot, the Live Activity's data.
      - path: iOS/Shared
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
      - package: PassthroughCore
        product: PassthroughUI
      # iPad: QR pairing with its iPhone (the iPad's pairing listener).
      - package: PassthroughCore
        product: PhoneTransport
      # Remote shell over iroh. App only: never link it into the tunnel extension.
      - package: PassthroughCore
        product: IrohTransport
      - package: PassthroughCore
        product: ScreenClient
      - package: SwiftTerm
        product: SwiftTerm
      - target: PassthroughTunnel
      - target: PassthroughWidgets
      - target: PassthroughNotifications
    info:
      path: iOS/App/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        CFBundleDisplayName: Passthrough
        UILaunchScreen: {}
        # iPhone: landscape is for the Mac's screen only (AppOrientation keeps the rest portrait).
        # iPad: every orientation, as Split View and Stage Manager need.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Automatic
        # ProMotion iPhones show the Mac's screen at up to 120 frames a second (Smooth, Fast).
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Passthrough finds your linked Mac on this iPhone's Personal Hotspot, or over peer-to-peer Wi-Fi, when the wireless link is on, and reaches your Mac's shell on the same network.
        NSFaceIDUsageDescription: Passthrough uses Face ID to keep your Mac's shell and settings private.
        NSCameraUsageDescription: Passthrough scans the code an iPad shows, to let it use this iPhone's internet.
        NSMicrophoneUsageDescription: Passthrough sends your voice to your Mac while you turn the microphone on in its screen view, so the Mac can use this device as its microphone.
        NSBonjourServices: [_passthrough._tcp, _passthrough-sh._tcp]
        # Step away's Live Activity: started and updated by the app only (no push).
        NSSupportsLiveActivities: true
        # passthrough:// links from the Live Activity, widgets and Control Center (AppLink).
        CFBundleURLTypes:
          - CFBundleURLName: $(PASSTHROUGH_ID).ios
            CFBundleURLSchemes: [passthrough]
    entitlements:
      path: iOS/App/Passthrough.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        # The second group is the widget's (MacSnapshot.appGroup): it holds no
        # secrets. The third is the notification extension's: only the keys
        # Macs seal notices with (PushKeys), never the pairing secrets.
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID), group.$(PASSTHROUGH_ID).widget, group.$(PASSTHROUGH_ID).push]
        # Notices from Macs through Apple's push service (Xcode switches to
        # production for an archive). Time Sensitive: "needs you" gets through Focus.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).ios
        PRODUCT_NAME: Passthrough
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  PassthroughTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Tunnel
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
      # iPad: "Internet through iPhone" (the Mac's side of the link, and tun2socks).
      - package: PassthroughCore
        product: PhoneTransport
      - package: PassthroughCore
        product: CUtun
      - framework: Vendor/HevSocks5Tunnel/HevSocks5Tunnel.xcframework
        embed: false
    info:
      path: iOS/Tunnel/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        CFBundleDisplayName: Passthrough Tunnel
        NSLocalNetworkUsageDescription: Passthrough finds your linked Mac on this iPhone's Personal Hotspot, or over peer-to-peer Wi-Fi, when the wireless link is on.
        NSBonjourServices: [_passthrough._tcp, _passthrough-sh._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: iOS/Tunnel/PassthroughTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).ios.tunnel
        PRODUCT_NAME: PassthroughTunnel
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/HevSocks5Tunnel/include
        OTHER_LDFLAGS: ["-lresolv"]

  # The Live Activity, the Home Screen widget and the Control Center buttons.
  # It never reaches the Mac: it shows what the app last saw (an app group of its
  # own, not the one whose Keychain holds the pairing secrets) and opens the app.
  PassthroughWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Widgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: iOS/Shared
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
      - package: PassthroughCore
        product: PassthroughUI
    info:
      path: iOS/Widgets/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        CFBundleDisplayName: Passthrough
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widgets/PassthroughWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID).widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).ios.widgets
        PRODUCT_NAME: PassthroughWidgets
        TARGETED_DEVICE_FAMILY: "1,2"

  # Opens the sealed notices Macs send through Apple's push service
  # (PushBox) and shows what they say. Its app group holds only those keys.
  PassthroughNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Notifications
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
    info:
      path: iOS/Notifications/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        CFBundleDisplayName: Passthrough Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: iOS/Notifications/PassthroughNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.$(PASSTHROUGH_ID).push]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).ios.notifications
        PRODUCT_NAME: PassthroughNotifications
        TARGETED_DEVICE_FAMILY: "1,2"

  # ───────────────────────── macOS ─────────────────────────
  PassthroughMac:
    type: application
    platform: macOS
    sources:
      - path: macOS/App
        excludes: ["Info.plist", "*.entitlements", "*.plist"]
      - path: macOS/Shared
      # VPN-layer engines, spawned by the root helper. Signed on copy so the
      # helper can verify they carry our Team ID before executing them as root.
      - path: Vendor/VPNEngines/bin/wireguard-go
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: Vendor/VPNEngines/bin/openvpn
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
      - package: PassthroughCore
        product: PassthroughUI
      - package: PassthroughCore
        product: PhoneTransport
      - package: PassthroughCore
        product: VPNConfig
      - package: PassthroughCore
        product: ShellHost
      - package: PassthroughCore
        product: ScreenHost
      - package: PassthroughCore
        product: IrohTransport
      - package: SwiftTerm
        product: SwiftTerm
      - target: PassthroughHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
      # What a terminal window runs to show one of the app's sessions.
      - target: PassthroughTerm
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
      # The phone's microphone as an input device. The root helper copies it from
      # here into /Library/Audio/Plug-Ins/HAL once its signature checks out.
      - target: PassthroughMicrophone
        embed: true
        link: false
        codeSign: true
        copy:
          destination: plugins
    postCompileScripts:
      - name: Install launchd plist
        inputFiles: [$(SRCROOT)/macOS/App/LaunchDaemon.plist]
        outputFiles: [$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(PASSTHROUGH_ID).helper.plist]
        script: |
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          sed "s/\$(PASSTHROUGH_ID)/$PASSTHROUGH_ID/g" "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
      # The APNs key for phone notifications, if Signing.xcconfig names one
      # (PASSTHROUGH_PUSH_KEY_FILE), as Resources/AuthKey_<Key ID>.p8;
      # PhoneNotifications reads it. Runs every build so removing the setting removes the key.
      - name: Bundle push key
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          file="${PASSTHROUGH_PUSH_KEY_FILE:-}"
          if [ -z "$file" ]; then
            rm -f "$dest"/AuthKey_*.p8
            echo "No PASSTHROUGH_PUSH_KEY_FILE: building without phone notifications."
            exit 0
          fi
          case "$file" in
            /*) src="$file" ;;
            "~/"*) src="$HOME/${file#\~/}" ;;
            *) src="$SRCROOT/$file" ;;
          esac
          if [ ! -f "$src" ]; then
            echo "error: PASSTHROUGH_PUSH_KEY_FILE in Config/Signing.xcconfig names $src, which isn't there."
            exit 1
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$src"; then
            echo "error: $src isn't an APNs key (.p8) file."
            exit 1
          fi
          id="${PASSTHROUGH_PUSH_KEY_ID:-}"
          name="$(basename "$src" .p8)"
          if [ -z "$id" ]; then
            case "$name" in AuthKey_*) id="${name#AuthKey_}" ;; esac
          fi
          if ! printf '%s' "$id" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "error: set PASSTHROUGH_PUSH_KEY_ID in Config/Signing.xcconfig (ten letters and digits): the key file's name doesn't give it."
            exit 1
          fi
          if ! printf '%s' "${PASSTHROUGH_PUSH_TEAM_ID:-}" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "error: a push key needs its team: DEVELOPMENT_TEAM, or PASSTHROUGH_PUSH_TEAM_ID if the key is another team's, in Config/Signing.xcconfig."
            exit 1
          fi
          mkdir -p "$dest"
          # Only another key is removed, and an unchanged one isn't rewritten (which would make Xcode re-sign the app).
          find "$dest" -maxdepth 1 -name 'AuthKey_*.p8' ! -name "AuthKey_$id.p8" -delete
          cmp -s "$src" "$dest/AuthKey_$id.p8" || cp "$src" "$dest/AuthKey_$id.p8"
          # Readable only by the account that owns the app.
          chmod 0600 "$dest/AuthKey_$id.p8"
          echo "Bundled push key $id for team $PASSTHROUGH_PUSH_TEAM_ID."
    info:
      path: macOS/App/Info.plist
      properties:
        PassthroughID: $(PASSTHROUGH_ID)
        # The bundled push key's team (PhoneNotifications); DEVELOPMENT_TEAM unless Signing.xcconfig says otherwise.
        PassthroughPushTeamID: $(PASSTHROUGH_PUSH_TEAM_ID)
        CFBundleDisplayName: Passthrough
        LSUIElement: true
        LSMinimumSystemVersion: "14.5"
        NSHumanReadableCopyright: ""
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Passthrough listens for your linked phone on the local network, such as the phone's Personal Hotspot, when it connects wirelessly.
        NSBonjourServices: [_passthrough._tcp, _passthrough-sh._tcp]
    entitlements:
      path: macOS/App/PassthroughMac.entitlements
      properties:
        # Needed for the data-protection keychain (kSecUseDataProtectionKeychain).
        keychain-access-groups: [$(AppIdentifierPrefix)$(PASSTHROUGH_ID).mac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).mac
        PRODUCT_NAME: Passthrough
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        # iroh-ffi ships a macOS arm64 slice only (like the helper's engines).
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
      configs:
        # Xcode adds com.apple.security.get-task-allow to development-signed
        # builds, which lets any process of the user's attach and inject code
        # that then speaks to the root helper as this app. A Release helper
        # refuses clients that carry it (CodeSigning.requirementForOwnTeam).
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  PassthroughHelper:
    type: tool
    platform: macOS
    sources:
      - path: macOS/Helper
      - path: macOS/Shared
    dependencies:
      # Parsing and pinning only (Foundation + CryptoKit); keeps the root helper's surface small.
      - package: PassthroughCore
        product: VPNConfig
      # Its pure decisions (XPC input checks, process and socket ownership), tested in the package.
      - package: PassthroughCore
        product: HelperLogic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).helper
        PRODUCT_NAME: PassthroughHelper
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/HevSocks5Tunnel/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/HevSocks5Tunnel/lib
        OTHER_LDFLAGS: ["-lhev-socks5-tunnel", "-lresolv"]
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: macOS/Helper/Info.plist
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
      configs:
        # No get-task-allow in Release: the helper refuses debuggable clients.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # Runs inside a terminal window on the Mac and shows a session of the app's
  # in it, so paired phones see the same terminal (LocalTerminalClient). The
  # source is the package's, which builds and tests it too.
  PassthroughTerm:
    type: tool
    platform: macOS
    sources:
      - path: Packages/PassthroughCore/Sources/passthrough-term
    dependencies:
      - package: PassthroughCore
        product: PassthroughCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).term
        PRODUCT_NAME: passthrough-term
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # A Core Audio server plug-in: the "Passthrough Microphone" input device, which
  # records what the app plays to it (a phone's voice, while it views the screen).
  # coreaudiod loads it from /Library/Audio/Plug-Ins/HAL, where the helper installs it.
  PassthroughMicrophone:
    type: bundle
    platform: macOS
    sources:
      - path: macOS/Microphone
        excludes: ["Info.plist"]
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSTHROUGH_ID).microphone
        PRODUCT_NAME: PassthroughMicrophone
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: macOS/Microphone/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  Passthrough:
    build:
      targets: { Passthrough: all }
    run:
      config: Debug
  PassthroughMac:
    build:
      targets: { PassthroughMac: all }
    run:
      config: Debug
